<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Country Explorer Kids - Fun interactive world geography for kids aged 4-6!"/>
<meta name="theme-color" content="#1a1a2e"/>
<link rel="manifest" href="manifest.json"/>
<title>Country Explorer Kids 🗺️</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#0f3460 100%);font-family:'Fredoka One',cursive;color:white;overflow-x:hidden}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes chug{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes stamp{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes burst{0%{transform:scale(0);opacity:0}60%{transform:scale(1.4);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.star{position:fixed;border-radius:50%;background:white;pointer-events:none}
#header{padding:13px 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.38);border-bottom:2px solid rgba(255,255,255,.07);position:sticky;top:0;z-index:100}
.nav-btn{border:none;border-radius:11px;padding:6px 12px;color:white;cursor:pointer;font-size:12px;font-family:'Nunito',sans-serif;font-weight:700;transition:all .2s}
.nav-btn:hover{opacity:.82;transform:scale(1.04)}
.counter{background:rgba(255,215,0,.13);border:2px solid gold;border-radius:18px;padding:3px 11px;font-size:12px;font-family:'Nunito',sans-serif;font-weight:800}
#map-view{padding:14px 13px 36px}
.continent-pills{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.pill{border-radius:14px;padding:4px 11px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:11px;font-family:'Nunito',sans-serif;font-weight:700;transition:all .2s;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07)}
.countries-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-width:980px;margin:0 auto}
.country-card{border-radius:16px;padding:0;cursor:pointer;color:white;display:flex;flex-direction:column;align-items:stretch;transition:all .2s;overflow:hidden;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05)}
.country-card:hover{transform:scale(1.06);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.country-card:active{transform:scale(.95)}
.card-thumb{width:100%;height:72px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:30px}
.card-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.card-info{padding:8px 7px 10px;text-align:center}
#country-view{max-width:480px;margin:0 auto;padding:14px 14px 36px;display:flex;flex-direction:column;align-items:center;gap:14px}
.step-card{animation:fadeUp .4s ease forwards;border-radius:26px;overflow:hidden;width:100%}
.photo-box{width:100%;height:200px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:64px;background:#0d1b2a}
.photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.photo-box img.ready{opacity:1}
.photo-box .shimmer{position:absolute;inset:0;background:linear-gradient(90deg,#0d1b2a 25%,#1a2d42 50%,#0d1b2a 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.photo-caption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:22px 14px 10px;font-size:11px;font-family:'Nunito',sans-serif;font-weight:600;color:rgba(255,255,255,.93)}
.step-body{padding:16px 20px 20px;text-align:center}
.step-label{font-size:11px;opacity:.6;font-family:'Nunito',sans-serif;margin-bottom:6px;letter-spacing:1.5px;text-transform:uppercase}
.step-text{font-size:15px;font-family:'Nunito',sans-serif;line-height:1.65}
.action-btn{border:none;border-radius:20px;padding:13px 32px;color:white;cursor:pointer;font-size:16px;font-family:'Fredoka One',cursive;box-shadow:0 4px 18px rgba(0,0,0,.32);transition:transform .15s}
.action-btn:hover{transform:scale(1.06)}
.dots{display:flex;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;transition:background .3s}
.back-btn{background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:11px;padding:6px 16px;color:rgba(255,255,255,.6);cursor:pointer;font-size:12px;font-family:'Nunito',sans-serif}
#passport-view{padding:18px 14px;max-width:660px;margin:0 auto}
.passport-book{background:linear-gradient(135deg,#1e3a5f,#0a1628);border:3px solid #c9a84c;border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.stamp-grid{display:flex;flex-wrap:wrap;gap:9px}
.stamp{border-radius:50%;border:3px dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;background:white;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<script>
for(let i=0;i<20;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2.5+1;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:.15;animation:twinkle ${2+Math.random()*3}s ease-in-out infinite ${Math.random()*2}s`;
  document.body.appendChild(s);
}
</script>

<div id="map-view">

<div id="passport-view" style="display:none">
  <div class="passport-book">
    <div style="text-align:center;border-bottom:2px solid #c9a84c2a;padding-bottom:14px;margin-bottom:18px">
      <div style="font-size:36px">🦋</div>
      <div style="font-size:19px;color:#c9a84c">My World Passport</div>
      <div style="font-size:11px;font-family:'Nunito',sans-serif;opacity:.6;margin-top:3px">Explorer's Collection • <span id="passport-count">0</span> countries visited</div>

    </div>
    <div id="champion-banner" style="display:none;margin-top:20px;text-align:center;background:linear-gradient(135deg,#ffd70018,#ff690018);border:2px solid gold;border-radius:18px;padding:18px">

  </div>
</div>

// Cache for fetched Wikipedia image URLs
const imgCache = {};

// Fetch the lead image from a Wikipedia article
async function getWikiImage(title) {
  if (imgCache[title]) return imgCache[title];
  try {
    const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&pithumbsize=640&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();
    const pages = Object.values(data.query.pages);
    const src = pages[0]?.thumbnail?.source || null;
    imgCache[title] = src;
    return src;
  } catch(e) {
    return null;
  }
}

// Load a photo into a .photo-box element
async function loadPhoto(boxId, wikiTitle, fallbackEmoji) {
  const box = document.getElementById(boxId);
  if (!box) return;
  const src = await getWikiImage(wikiTitle);
  if (src) {
    const img = box.querySelector('img');
    const shimmer = box.querySelector('.shimmer');
    if (img) {
      img.onload = () => { img.classList.add('ready'); if(shimmer) shimmer.style.display='none'; };
      img.onerror = () => { img.style.display='none'; box.querySelector('.fb').style.display='flex'; if(shimmer) shimmer.style.display='none'; };
      img.src = src;
    }
  } else {
    const shimmer = box.querySelector('.shimmer');
    if(shimmer) shimmer.style.display='none';
    const fb = box.querySelector('.fb');
    if(fb) fb.style.display='flex';
  }
}

let visited={}, currentCountry=null, currentStep=0, selectedContinent=null;
document.getElementById('total-count').textContent=COUNTRIES.length;

function showView(v){
  ['map','country','passport'].forEach(x=>{
    const el=document.getElementById(x+'-view');
    el.style.display=x===v?(x==='country'?'flex':'block'):'none';
  });
  document.getElementById('btn-map').style.background=v==='map'?'#ff6b35':'rgba(255,255,255,.1)';
  document.getElementById('btn-passport').style.background=v==='passport'?'#ff6b35':'rgba(255,255,255,.1)';
  if(v==='passport') renderPassport();
}

function renderMap(){
  const continents=[...new Set(COUNTRIES.map(c=>c.continent))];
  const pills=document.getElementById('continent-pills');
  pills.innerHTML='';
  continents.forEach(cont=>{
    const done=COUNTRIES.filter(c=>c.continent===cont&&visited[c.name]).length;
    const total=COUNTRIES.filter(c=>c.continent===cont).length;
    const active=selectedContinent===cont;
    const p=document.createElement('div'); p.className='pill';
    p.style.borderColor=active?CONTINENT_COLORS[cont]:'rgba(255,255,255,.12)';
    p.style.background=active?CONTINENT_COLORS[cont]+'44':'rgba(255,255,255,.07)';
    if(active) p.style.transform='scale(1.05)';
    p.innerHTML=`${CONTINENT_GEMS[cont]} ${cont} <span style="opacity:.65">${done}/${total}</span>`;
    p.onclick=()=>{selectedContinent=active?null:cont; renderMap();};
    pills.appendChild(p);
  });
  const grid=document.getElementById('countries-grid');
  grid.innerHTML='';
  (selectedContinent?COUNTRIES.filter(c=>c.continent===selectedContinent):COUNTRIES).forEach(country=>{
    const isV=!!visited[country.name];
    const card=document.createElement('div'); card.className='country-card';
    card.style.border=`2px solid ${isV?country.color:'rgba(255,255,255,.1)'}`;
    card.style.background=isV?`linear-gradient(160deg,${country.color}44,${country.color}18)`:'rgba(255,255,255,.05)';
    if(isV) card.style.boxShadow=`0 0 16px ${country.color}55`;
    const thumbId=`thumb-${country.name.replace(/\s/g,'-')}`;
    card.innerHTML=`
      <div class="card-thumb" style="background:${country.color}33" id="${thumbId}">
        <span>${country.flag}</span>
        <img style="opacity:0"/>
        ${isV?`<div style="position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:22px;z-index:2">⭐</div>`:''}
      </div>
      <div class="card-info">
        <div style="font-size:22px">${country.flag}</div>
        <div style="font-size:10px;font-family:'Nunito',sans-serif;font-weight:700;line-height:1.3;margin-top:3px">${country.name}</div>
        <div style="font-size:9px;opacity:.5;font-family:'Nunito',sans-serif">${country.continent}</div>
        ${isV?'<div style="font-size:13px;margin-top:2px">⭐</div>':''}
      </div>`;
    card.onclick=()=>visitCountry(country);
    grid.appendChild(card);
    // Lazy-load thumbnail
    getWikiImage(country.wikiLandmark).then(src=>{
      if(!src) return;
      const box=document.getElementById(thumbId);
      if(!box) return;
      const img=box.querySelector('img');
      if(img){ img.onload=()=>{img.style.opacity=1; box.querySelector('span').style.display='none';}; img.src=src; }
    });
  });
}

function visitCountry(country){
  currentCountry=country; currentStep=0;
  document.getElementById('train-body').setAttribute('fill',country.color);
  document.getElementById('train-cab').setAttribute('fill',country.color);
  showView('country');
  renderStep();
}

  return `<div class="photo-box" id="${id}">
    <div class="shimmer"><span style="font-size:32px;animation:float 1s ease-in-out infinite">🦋</span><span style="font-size:10px;opacity:.5;font-family:'Nunito',sans-serif">Loading photo...</span></div>

    <img/>
    <div class="photo-caption">${caption}</div>
  </div>`;
}

function renderStep(){

  const cont=document.getElementById('step-container');

  if(currentStep===0){
    const boxId=`pbox-landmark-${Date.now()}`;
    html=`<div class="step-card" style="background:linear-gradient(160deg,${c.color}28,rgba(255,255,255,.03));border:3px solid ${c.color}">
      ${makePhotoBox(boxId,`📸 A famous sight in ${c.name}`,c.flag)}
      <div class="step-body"><div style="font-size:56px">${c.flag}</div><div style="font-size:24px;margin-top:6px">${c.name}</div><div class="step-text" style="margin-top:10px;opacity:.93">${c.greeting}</div></div>

    const boxId=`pbox-capital-${Date.now()}`;
    html=`<div class="step-card" style="background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14)">

    cont.innerHTML=html+actionHTML(c);
    loadPhoto(boxId, c.wikiCapital, c.flag);
    return;
  } else if(currentStep===3){
    html=`<div class="step-card" style="background:linear-gradient(160deg,${cc}20,rgba(255,255,255,.03));border:2px solid ${cc};padding:24px 20px;text-align:center">

      <div class="step-text" style="margin-top:12px">${c.continentFact}</div>
    </div>`;
  } else if(currentStep===4){
    const boxId=`pbox-wow-${Date.now()}`;
    html=`<div class="step-card" style="background:linear-gradient(160deg,#7c3aed28,#db277718);border:2px solid #a855f7">
      ${makePhotoBox(boxId,`🤩 Amazing ${c.name}!`,c.flag)}
      <div class="step-body"><div class="step-label">🎉 Wow Fact!</div><div style="font-size:44px;animation:bounce 1s ease-in-out infinite">🤩</div><div class="step-text" style="margin-top:12px">${c.funFact}</div></div>
    </div>`;
    cont.innerHTML=html+actionHTML(c);
    loadPhoto(boxId, c.wikiLandmark, c.flag);
    return;
  } else if(currentStep===5){
    const total=COUNTRIES.filter(x=>x.continent===c.continent).length;
    const done=COUNTRIES.filter(x=>x.continent===c.continent&&visited[x.name]).length;
    html=`<div class="step-card" style="text-align:center;padding:10px 0;background:transparent;overflow:visible;border:none">
      <div style="font-size:17px;font-family:'Nunito',sans-serif;margin-bottom:12px">📖 Passport Stamped!</div>
      <div style="display:flex;justify-content:center;animation:stamp .6s cubic-bezier(.36,.07,.19,.97) forwards">${stampHTML(c,80)}</div>
      <div style="font-size:28px;margin-top:16px">⭐⭐⭐</div>
      <div style="font-size:18px;margin-top:8px;color:#ffd700">Amazing job, Explorer!</div>
      ${done+1===total?`<div style="margin-top:16px;background:rgba(255,215,0,.13);border:2px solid gold;border-radius:18px;padding:12px 18px;font-size:14px;font-family:'Nunito',sans-serif;animation:burst .5s ease forwards">${CONTINENT_GEMS[c.continent]} You collected the ${c.continent} gem! 🎉</div>`:''}
    </div>`;
  }
  cont.innerHTML=html+actionHTML(c);
}

function actionHTML(c){
  const labels=['🚩 See the Flag!','🏙️ Capital City!','🌍 Continent!','🤩 Wow Fact!','📖 Get Stamp!','🗺️ Next Station!'];
  const bg=currentStep===5?'linear-gradient(135deg,#ff6b35,#f7931e)':`linear-gradient(135deg,${c.color},${c.color}99)`;
  let dots='';
  if(currentStep>0&&currentStep<5){
    dots=`<div class="dots">${[0,1,2,3,4].map(i=>`<div class="dot" style="background:${i<=currentStep?c.color:'rgba(255,255,255,.18)'}"></div>`).join('')}</div>`;
  }
  return `<div style="display:flex;justify-content:center;width:100%"><button class="action-btn" style="background:${bg}" onclick="stepAction()">${labels[currentStep]}</button></div>${dots}`;
}

function stepAction(){
  if(currentStep<5){
    if(currentStep===4){
      visited[currentCountry.name]=true;
      document.getElementById('visit-count').textContent=Object.keys(visited).length;
      renderMap();
    }
    currentStep++; renderStep();
  } else { showView('map'); }
}

function stampHTML(country,size){
  const cc=CONTINENT_COLORS[country.continent];
  return `<div class="stamp" style="width:${size}px;height:${size}px;border-color:${cc};font-size:${size<70?22:30}px">
    <span>${country.flag}</span>
    ${size>=70?`<span style="font-size:8px;font-weight:bold;color:${cc};text-align:center;font-family:'Nunito',sans-serif">${country.name}</span>`:''}
  </div>`;
}

function renderPassport(){
  const vc=Object.keys(visited).length;
  document.getElementById('passport-count').textContent=vc;
  document.getElementById('stamp-count').textContent=vc;
  const continents=[...new Set(COUNTRIES.map(c=>c.continent))];
  const gg=document.getElementById('gems-grid'); gg.innerHTML='';
  continents.forEach(cont=>{
    const done=COUNTRIES.filter(c=>c.continent===cont&&visited[c.name]).length;
    const total=COUNTRIES.filter(c=>c.continent===cont).length;
    const unlocked=done===total, cc=CONTINENT_COLORS[cont];
    const g=document.createElement('div');
    g.style.cssText=`display:flex;align-items:center;gap:5px;background:${unlocked?cc+'2a':'rgba(255,255,255,.04)'};border:1.5px solid ${unlocked?cc:'rgba(255,255,255,.1)'};border-radius:12px;padding:5px 10px;font-size:11px;font-family:'Nunito',sans-serif`;
    g.innerHTML=`<span style="font-size:15px;filter:${unlocked?'none':'grayscale(1)'}">${CONTINENT_GEMS[cont]}</span><div><div style="font-weight:700;font-size:10px">${cont}</div><div style="opacity:.6;font-size:9px">${done}/${total}</div></div>`;
    gg.appendChild(g);
  });
  const sg=document.getElementById('stamp-grid');
  const vl=COUNTRIES.filter(c=>visited[c.name]);
  if(!vl.length){
    sg.innerHTML=`<div style="text-align:center;padding:28px;opacity:.4;font-family:'Nunito',sans-serif;font-size:13px;width:100%">No stamps yet! Visit your first country. 🚂</div>`;
  } else {
    sg.innerHTML='';
    vl.forEach(c=>{const s=document.createElement('div');s.innerHTML=stampHTML(c,60);s.title=c.name;s.style.cursor='pointer';s.onclick=()=>visitCountry(c);sg.appendChild(s);});
  }
  document.getElementById('champion-banner').style.display=vc===COUNTRIES.length?'block':'none';
}

renderMap();
</script>
</body>
</html>
